[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.3", features = ["bytemuck"] }
png = "0.18.1"
pollster = "1.0.2"
regnum-assets = { path = "crates/assets" }
regnum-game = { path = "crates/game" }
regnum-renderer = { path = "crates/renderer" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
wgpu = "30.0.2"
winit = "0.30.13"
